name: Lab checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r starter/requirements.txt
      - run: python scripts/verify_submission.py
      - run: python scripts/test_evaluation_strict.py
      - run: python scripts/test_obsolete_chunks.py
      - run: python scripts/test_pipeline_safety.py
      - run: python scripts/test_demo.py
